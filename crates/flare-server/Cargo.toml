[package]
name = "flare-server"
description = "Flare server: owns the shared sessions' event logs; clients attach over WebSocket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flare-core = { workspace = true }
flare-link = { workspace = true }
island-client = { workspace = true, features = ["net"] }
island-core = { workspace = true }
axum = { workspace = true, features = ["ws"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "net", "sync", "signal"] }

[dev-dependencies]
island-log = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "io-util"] }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { workspace = true }
