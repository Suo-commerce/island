[package]
name = "flare-link"
description = "Flare link: pulls the Island log to a verified local replica."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flare-core = { workspace = true }
island-client = { workspace = true, features = ["net"] }
island-core = { workspace = true }
island-log = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "time", "signal"] }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net"] }
serde = { workspace = true }
