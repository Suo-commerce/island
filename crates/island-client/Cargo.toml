[package]
name = "island-client"
description = "Island client: builds and signs submissions, decodes records. Used by Flare and coding-session tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The calls to a broker. Without it the crate only builds, signs and
# decodes, and pulls in no network or async code.
net = ["dep:rmcp", "dep:reqwest", "dep:tokio"]

[dependencies]
island-core = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
rmcp = { workspace = true, optional = true, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
proptest = { workspace = true }
