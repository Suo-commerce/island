[package]
name = "island-sender"
description = "Island sender: Taso's sender for a Vessel; sends only what an approver approved (S2 plan, decision D2)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
island-client = { workspace = true, features = ["net"] }
island-core = { workspace = true }
island-env = { workspace = true }
island-log = { workspace = true }
taso-core = { workspace = true }
taso-field = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
