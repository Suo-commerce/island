[package]
name = "island-socket"
description = "Island socket: what a Vessel's agent may ask Island, answered on a Unix socket in its root filesystem (docs/slice-2.md, \"The island socket\")."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
island-client = { workspace = true, features = ["net"] }
island-core = { workspace = true }
island-env = { workspace = true }
island-log = { workspace = true }
taso-core = { workspace = true }
axum = { workspace = true }
blake3 = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "macros", "signal", "fs"] }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
