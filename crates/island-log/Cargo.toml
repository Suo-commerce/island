[package]
name = "island-log"
description = "Island log: the single appender, the reader and replay over the hash-chained log."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
island-auth = { workspace = true }
island-core = { workspace = true }
island-gate = { workspace = true }
island-env = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Test support, not a tool: the process `tests/crash.rs` kills with
# SIGKILL while it appends to a real file.
[[bin]]
name = "island-log-crash-writer"
path = "tests/support/crash_writer.rs"
test = false
doc = false
