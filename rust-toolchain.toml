# The toolchain the repo is formatted and checked with, the same one Taso
# pins.  Pinned so that a new stable rustfmt or clippy cannot turn main red
# with no change in the code; moved by hand, with the code fixed in the
# same commit.
[toolchain]
channel = "1.97.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
