# CI: every push and every pull request.
#
# Runs exactly what `just check` and `just test` run locally: formatting,
# Clippy with the determinism bans (clippy.toml), the dependency rules
# (scripts/check-deps.py), licences, advisories and sources (deny.toml),
# then the tests.  The harness job joins with build step 4.
#
# RUST_VERSION below must match rust-toolchain.toml, so CI and a laptop use
# the same rustfmt and clippy; move both in the same commit.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:   # a newer push to the same ref cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny
      - uses: Swatinem/rust-cache@v2
      - run: just check
      - run: just test
